<body id="body">

<nav id="nav">

<div class="panel-wrapper">
<main id="mainWrp">
  <h1>event log</h1>
  <div class="mediaViewer">
    <video src="../media/videos/popups/tadcpopup_bnb.mp4" loop controls class="videoContainer"></video>
    <h2 class="mediaVidTitle">most recent event</h2>
	<div class="mediaVidDescription">
	  <span class="list-description">

	</div>
  </div>
  <div class="playlist">
	<div class="list">
      <video src="../media/videos/popups/tadcpopup_bnb.mp4" class="list-video"></video>
	  <h2 class="list-title">tadc popup 6/27</h2>
	  <span class="list-description">
	    <p>footage provided by the host of the event, luckybot29 (<a href="https://www.tiktok.com/@luckybot29/" target="tiktok">tiktok</a>, <a href="https://www.instagram.com/the_luckybot/" target="_blank">instagram</a>). the full blogpost about the event can be read <a href="../pierrotbuckshot/place/bobabrothtadcpopup2026.html">here</a>.</p>

	  </span>
    </div>
  </div>
</main>
<aside id="asideWrp">
</aside>
</div>
<footer id="footer">
</footer>
<script>theme = 1;loadTheme();</script>
<script>
let videoList = document.querySelectorAll('.playlist .list');

videoList.forEach(vid =>{
   vid.onclick = () =>{
      videoList.forEach(remove =>{remove.classList.remove('active')});
      vid.classList.add('active');
      let src = vid.querySelector('.list-video').src;
      let title = vid.querySelector('.list-title').innerHTML;
      let description = vid.querySelector('.list-description').innerHTML;
      document.querySelector('.mediaViewer .videoContainer').src = src;
      document.querySelector('.mediaViewer .videoContainer').play();
      document.querySelector('.mediaViewer .mediaVidTitle').innerHTML = title;
      document.querySelector('.mediaViewer .mediaVidDescription').innerHTML = description;
   };
});
</script>
</body>
</html>
